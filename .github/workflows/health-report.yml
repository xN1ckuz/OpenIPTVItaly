name: IPTV Health Check

on:
  schedule:
    - cron: "45 18 * * *"   # Winter → 19:45 Italy
    - cron: "45 17 * * *"   # Summer → 19:45 Italy
  workflow_dispatch:

jobs:
  check-streams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install ffmpeg (ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Dashboard
        run: bash $GITHUB_WORKSPACE/.github/workflows/iptv-dashboard.sh

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v6
        with:
          name: iptv-health-report
          path: health_report.txt
